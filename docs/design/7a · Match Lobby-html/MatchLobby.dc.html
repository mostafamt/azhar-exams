<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مباراة جديدة</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A5B4FC}a:hover{color:#C7D2FE}
@keyframes dcspin{to{transform:rotate(360deg)}}
@keyframes dcping{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.9);opacity:0}}
.dc-spin{animation:dcspin 1.1s linear infinite}
.dc-ping{animation:dcping 1.6s ease-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F172A; color: #F8FAFC; font-family: 'Cairo', sans-serif; direction: rtl; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px">
    <a href="Home.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 12px; background: #1E293B; border: 1px solid #334155; color: #F8FAFC; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
    <h1 style="margin: 0; flex: 1; font-size: 22px; font-weight: 800">مباراة جديدة</h1>
    <div style="display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: rgba(99,102,241,0.18); color: #A5B4FC; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"></path></svg><span dir="ltr">1,240</span></div>
  </div>

  <sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 24px; overflow: hidden">

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 14px; font-weight: 700; color: #94A3B8">المادة</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <sc-for list="{{subjects}}" as="sub" hint-placeholder-count="4">
            <button type="button" onClick="{{sub.pick}}" aria-pressed="{{sub.pressed}}" style="height: 40px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: {{sub.bg}}; color: {{sub.fg}}; border: 1.5px solid {{sub.border}}">{{sub.label}}</button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 14px; font-weight: 700; color: #94A3B8">مدة المباراة</div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{durations}}" as="d" hint-placeholder-count="3">
            <button type="button" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="height: 64px; border-radius: 14px; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; background: {{d.bg}}; color: #F8FAFC; border: 1.5px solid {{d.border}}">
              <span style="font-size: 17px; font-weight: 800">{{d.label}}</span>
              <span style="font-size: 12px; color: #94A3B8">{{d.sub}}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <button type="button" onClick="{{start}}" style="height: 60px; border-radius: 16px; border: none; background: #4F46E5; color: #FFFFFF; font-family: inherit; font-size: 19px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 0 #3730A3; margin: 4px 0 6px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"></path></svg>
        ابدأ المباراة
      </button>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <a href="Leagues.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 14px; background: #1E293B; border: 1px solid #334155; color: #F8FAFC; text-decoration: none">
          <span style="width: 36px; height: 36px; border-radius: 10px; background: rgba(245,158,11,0.16); color: #FBBF24; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg></span>
          <span style="flex: 1; font-size: 16px; font-weight: 700">البطولات</span>
          <span style="padding: 2px 8px; border-radius: 999px; background: rgba(239,68,68,0.16); color: #F87171; font-size: 12px; font-weight: 700">مباشر</span>
        </a>
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 14px; background: #1E293B; border: 1px solid #334155; color: #F8FAFC; text-decoration: none">
          <span style="width: 36px; height: 36px; border-radius: 10px; background: rgba(16,185,129,0.16); color: #34D399; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"></path></svg></span>
          <span style="flex: 1; font-size: 16px; font-weight: 700">تحدَّ صديقاً</span>
          <span style="color: #94A3B8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></span>
        </a>
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 14px; background: #1E293B; border: 1px solid #334155; color: #F8FAFC; text-decoration: none">
          <span style="width: 36px; height: 36px; border-radius: 10px; background: rgba(99,102,241,0.18); color: #A5B4FC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 8V4M9 14h.01M15 14h.01"></path></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">تدرّب ضد الروبوت</span><span style="font-size: 12px; color: #94A3B8">بدون تأثير على تصنيفك</span></span>
          <span style="color: #94A3B8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></span>
        </a>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 2px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <div style="font-size: 14px; font-weight: 700; color: #94A3B8">آخر المباريات</div>
          <a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none; padding: 8px 0">عرض الكل</a>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #1E293B; border: 1px solid #334155">
          <span style="width: 32px; height: 32px; border-radius: 16px; background: #334155; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">س</span>
          <span style="flex: 1; font-size: 14px; font-weight: 600">سارة محمود · رياضيات</span>
          <span style="font-size: 14px; font-weight: 800" dir="ltr">8 – 6</span>
          <span style="padding: 2px 8px; border-radius: 999px; background: rgba(16,185,129,0.16); color: #34D399; font-size: 12px; font-weight: 700">فوز</span>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{searching}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px; text-align: center">
      <div style="display: flex; align-items: center; gap: 18px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
          <div style="width: 84px; height: 84px; border-radius: 42px; background: #312E81; border: 3px solid #6366F1; color: #C7D2FE; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800">أ</div>
          <div style="font-size: 15px; font-weight: 700">أنت</div>
          <div style="font-size: 12px; color: #94A3B8" dir="ltr">1,240</div>
        </div>
        <div style="font-size: 22px; font-weight: 800; color: #F59E0B">VS</div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
          <div style="position: relative; width: 84px; height: 84px">
            <div class="dc-ping" style="position: absolute; inset: 0; border-radius: 42px; border: 2px solid #F59E0B"></div>
            <div style="position: absolute; inset: 0; border-radius: 42px; background: #1E293B; border: 3px dashed #475569; color: #94A3B8; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800">؟</div>
          </div>
          <div style="font-size: 15px; font-weight: 700; color: #94A3B8">منافس</div>
          <div style="font-size: 12px; color: #94A3B8">…</div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
        <div style="display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800">
          <svg class="dc-spin" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 1-9 9"></path></svg>
          جارٍ البحث عن منافس…
        </div>
        <div style="font-size: 14px; color: #94A3B8">{{summary}}</div>
        <div style="font-size: 13px; color: #94A3B8" dir="ltr">00:07</div>
      </div>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 10px">
        <a href="Match.dc.html" style="height: 54px; border-radius: 16px; background: #4F46E5; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">تم العثور على منافس — ادخل المباراة</a>
        <button type="button" onClick="{{cancel}}" style="height: 50px; border-radius: 16px; border: 1.5px solid #334155; background: transparent; color: #F8FAFC; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">إلغاء البحث</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"searching":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { subject: 'math', duration: 5, searching: null };
  }
  renderVals() {
    const searching = this.state.searching ?? (this.props.searching ?? false);
    const subs = [
      { id: 'mix', label: 'متنوع' },
      { id: 'math', label: 'رياضيات' },
      { id: 'phys', label: 'فيزياء' },
      { id: 'chem', label: 'كيمياء' },
      { id: 'ar', label: 'لغة عربية' }
    ];
    const durs = [
      { id: 3, label: '3 دقائق', sub: '10 أسئلة' },
      { id: 5, label: '5 دقائق', sub: '15 سؤال' },
      { id: 10, label: '10 دقائق', sub: '25 سؤال' }
    ];
    const subject = subs.find((x) => x.id === this.state.subject);
    const dur = durs.find((x) => x.id === this.state.duration);
    return {
      idle: !searching,
      searching,
      summary: subject.label + ' · ' + dur.label + ' · مباراة مصنّفة',
      start: () => this.setState({ searching: true }),
      cancel: () => this.setState({ searching: false }),
      subjects: subs.map((s) => {
        const sel = s.id === this.state.subject;
        return {
          ...s,
          pressed: sel ? 'true' : 'false',
          bg: sel ? 'rgba(99,102,241,0.18)' : '#1E293B',
          fg: sel ? '#C7D2FE' : '#94A3B8',
          border: sel ? '#6366F1' : '#334155',
          pick: () => this.setState({ subject: s.id })
        };
      }),
      durations: durs.map((d) => {
        const sel = d.id === this.state.duration;
        return {
          ...d,
          pressed: sel ? 'true' : 'false',
          bg: sel ? 'rgba(99,102,241,0.18)' : '#1E293B',
          border: sel ? '#6366F1' : '#334155',
          pick: () => this.setState({ duration: d.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
