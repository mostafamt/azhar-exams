<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل الدخول بالبريد</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A5B4FC}a:hover{color:#C7D2FE}
input::placeholder{color:#64748B}
input:focus{outline:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F172A; color: #F8FAFC; font-family: 'Cairo', sans-serif; direction: rtl; display: flex; flex-direction: column; padding: 20px 24px 28px; gap: 24px; overflow: hidden">
  <a href="Main.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 12px; background: #1E293B; border: 1px solid #334155; color: #F8FAFC; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800">أهلاً بعودتك</h1>
    <div style="font-size: 15px; color: #94A3B8">سجّل الدخول لمتابعة تقدّمك في الدوريات</div>
  </div>

  <form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="login-email" style="font-size: 14px; font-weight: 600">البريد الإلكتروني</label>
      <div style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 14px; border-radius: 14px; background: #1E293B; border: 1.5px solid #6366F1; box-shadow: 0 0 0 4px rgba(99,102,241,0.15)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
        <input id="login-email" type="email" autocomplete="email" dir="ltr" placeholder="name@example.com" style="flex: 1; min-width: 0; height: 100%; border: none; background: transparent; color: #F8FAFC; font-family: inherit; font-size: 16px; text-align: right">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="login-pass" style="font-size: 14px; font-weight: 600">كلمة المرور</label>
      <div style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 14px 0 6px; border-radius: 14px; background: #1E293B; border: 1.5px solid #334155">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <input id="login-pass" type="{{pwType}}" autocomplete="current-password" dir="ltr" placeholder="••••••••" style="flex: 1; min-width: 0; height: 100%; border: none; background: transparent; color: #F8FAFC; font-family: inherit; font-size: 16px; text-align: right">
        <button type="button" onClick="{{togglePw}}" aria-label="{{pwLabel}}" style="width: 44px; height: 44px; border: none; background: transparent; color: #94A3B8; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #94A3B8; min-height: 44px; cursor: pointer"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #6366F1; margin: 0">تذكّرني</label>
      <a href="Forgot.dc.html" style="font-size: 14px; font-weight: 700; text-decoration: none; padding: 10px 0">نسيت كلمة المرور؟</a>
    </div>
    <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #4F46E5; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">تسجيل الدخول</a>
  </form>

  <div style="display: flex; align-items: center; gap: 12px; color: #94A3B8; font-size: 13px" aria-hidden="true">
    <div style="flex: 1; height: 1px; background: #334155"></div>أو<div style="flex: 1; height: 1px; background: #334155"></div>
  </div>

  <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 54px; border-radius: 16px; border: 1.5px solid #334155; background: #1E293B; color: #F8FAFC; font-size: 15px; font-weight: 600; text-decoration: none">
    <span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; color: #4285F4; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; font-weight: 700; font-size: 14px" aria-hidden="true">G</span>
    المتابعة باستخدام Google
  </a>

  <div style="flex: 1"></div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 15px; color: #94A3B8">
    ليس لديك حساب؟
    <a href="Signup.dc.html" style="font-weight: 700; text-decoration: none; padding: 10px 4px">إنشاء حساب</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showPw: false };
  }
  renderVals() {
    const s = this.state.showPw;
    return {
      pwType: s ? 'text' : 'password',
      pwLabel: s ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور',
      togglePw: () => this.setState({ showPw: !s })
    };
  }
}
</script>
</body>
</html>
