<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الاختبار</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A5B4FC}a:hover{color:#C7D2FE}
@keyframes dcpulse{0%,100%{opacity:1}50%{opacity:.45}}
.dc-pulse{animation:dcpulse 1s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F172A; color: #F8FAFC; font-family: 'Cairo', sans-serif; direction: rtl; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 18px; overflow: hidden">

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Home.dc.html" aria-label="إنهاء الاختبار" style="width: 44px; height: 44px; border-radius: 12px; background: #1E293B; border: 1px solid #334155; color: #94A3B8; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
      <div style="font-size: 15px; font-weight: 700">السؤال 5 من 20</div>
      <sc-if value="{{lowTime}}" hint-placeholder-val="{{ false }}">
        <div class="dc-pulse" style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; background: rgba(239,68,68,0.16); border: 1px solid #EF4444; color: #F87171; font-size: 15px; font-weight: 800" dir="ltr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>00:01:38</div>
      </sc-if>
      <sc-if value="{{normalTime}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; background: #1E293B; border: 1px solid #334155; color: #F8FAFC; font-size: 15px; font-weight: 700" dir="ltr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>00:14:52</div>
      </sc-if>
    </div>
    <div style="height: 8px; border-radius: 4px; background: #1E293B; overflow: hidden" role="progressbar" aria-valuenow="5" aria-valuemin="0" aria-valuemax="20" aria-label="التقدم في الاختبار">
      <div style="width: 25%; height: 100%; border-radius: 4px; background: #6366F1"></div>
    </div>
  </div>

  <div style="background: #1E293B; border: 1px solid #334155; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="padding: 2px 10px; border-radius: 999px; background: rgba(99,102,241,0.18); color: #A5B4FC; font-size: 12px; font-weight: 700">الرياضيات · الجبر</span>
      <span style="font-size: 12px; color: #94A3B8">درجة واحدة</span>
    </div>
    <div style="font-size: 18px; font-weight: 700; line-height: 1.7">ما قيمتا المتغير التي تحقق المعادلة <span dir="ltr" style="white-space: nowrap">x² − 5x + 6 = 0</span>؟</div>
    <div style="position: relative; height: 150px; border-radius: 14px; background: #0F172A; border: 1px dashed #334155; display: flex; align-items: center; justify-content: center; color: #94A3B8; font-size: 13px">
      صورة السؤال (Cloudinary)
      <button type="button" aria-label="تكبير الصورة" style="position: absolute; left: 10px; bottom: 10px; width: 44px; height: 44px; border-radius: 12px; border: none; background: rgba(30,41,59,0.9); color: #F8FAFC; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4M11 8v6M8 11h6"></path></svg></button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; flex: 1">
    <sc-for list="{{options}}" as="opt" hint-placeholder-count="4">
      <button type="button" onClick="{{opt.pick}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 10px 14px; border-radius: 16px; font-family: inherit; color: #F8FAFC; cursor: pointer; text-align: right; box-sizing: border-box; background: {{opt.bg}}; border: 2px solid {{opt.border}}; box-shadow: {{opt.glow}}">
        <span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; background: {{opt.letterBg}}; color: {{opt.letterFg}}">{{opt.letter}}</span>
        <span dir="ltr" style="flex: 1; text-align: right; font-size: 16px; font-weight: 600">{{opt.text}}</span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; gap: 10px; align-items: center">
    <button type="button" style="height: 54px; padding: 0 16px; border-radius: 16px; border: 1px solid #334155; background: #1E293B; color: #F8FAFC; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 4px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>السابق</button>
    <button type="button" onClick="{{toggleFlag}}" aria-label="تمييز السؤال للمراجعة" aria-pressed="{{flaggedStr}}" style="width: 54px; height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: {{flagBg}}; border: 1px solid {{flagBorder}}; color: {{flagFg}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
    <a href="Result.dc.html" style="flex: 1; height: 54px; border-radius: 16px; background: #4F46E5; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">التالي<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lowTime":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'a', flagged: false };
  }
  renderVals() {
    const lowTime = this.props.lowTime ?? false;
    const raw = [
      { id: 'a', letter: 'أ', text: 'x = 2  ,  x = 3' },
      { id: 'b', letter: 'ب', text: 'x = −2  ,  x = −3' },
      { id: 'c', letter: 'ج', text: 'x = 1  ,  x = 6' },
      { id: 'd', letter: 'د', text: 'x = −1  ,  x = 6' }
    ];
    const options = raw.map((o) => {
      const sel = this.state.picked === o.id;
      return {
        ...o,
        pick: () => this.setState({ picked: o.id }),
        bg: sel ? 'rgba(99,102,241,0.16)' : '#1E293B',
        border: sel ? '#6366F1' : '#334155',
        glow: sel ? '0 0 0 4px rgba(99,102,241,0.18)' : 'none',
        letterBg: sel ? '#6366F1' : '#0F172A',
        letterFg: sel ? '#FFFFFF' : '#94A3B8'
      };
    });
    const f = this.state.flagged;
    return {
      lowTime,
      normalTime: !lowTime,
      options,
      toggleFlag: () => this.setState({ flagged: !f }),
      flaggedStr: f ? 'true' : 'false',
      flagBg: f ? 'rgba(245,158,11,0.16)' : '#1E293B',
      flagBorder: f ? '#F59E0B' : '#334155',
      flagFg: f ? '#FBBF24' : '#94A3B8'
    };
  }
}
</script>
</body>
</html>
