<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إنشاء حساب</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A5B4FC}a:hover{color:#C7D2FE}
input::placeholder{color:#64748B}
input:focus{outline:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F172A; color: #F8FAFC; font-family: 'Cairo', sans-serif; direction: rtl; display: flex; flex-direction: column; padding: 20px 24px 24px; gap: 20px; overflow: hidden">
  <a href="Main.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 12px; background: #1E293B; border: 1px solid #334155; color: #F8FAFC; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800">إنشاء حساب جديد</h1>
    <div style="font-size: 15px; color: #94A3B8">احفظ نتائجك ونافس في الدوريات</div>
  </div>

  <form style="display: flex; flex-direction: column; gap: 14px; margin: 0">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-name" style="font-size: 14px; font-weight: 600">الاسم الكامل</label>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 14px; background: #1E293B; border: 1.5px solid #334155">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
        <input id="su-name" type="text" autocomplete="name" placeholder="مثال: أحمد علي" style="flex: 1; min-width: 0; height: 100%; border: none; background: transparent; color: #F8FAFC; font-family: inherit; font-size: 16px">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-email" style="font-size: 14px; font-weight: 600">البريد الإلكتروني</label>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 14px; background: #1E293B; border: 1.5px solid #334155">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
        <input id="su-email" type="email" autocomplete="email" dir="ltr" placeholder="name@example.com" style="flex: 1; min-width: 0; height: 100%; border: none; background: transparent; color: #F8FAFC; font-family: inherit; font-size: 16px; text-align: right">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-pass" style="font-size: 14px; font-weight: 600">كلمة المرور</label>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px 0 6px; border-radius: 14px; background: #1E293B; border: 1.5px solid #6366F1; box-shadow: 0 0 0 4px rgba(99,102,241,0.15)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <input id="su-pass" type="{{pwType}}" autocomplete="new-password" dir="ltr" value="Exam2026" aria-describedby="su-pass-hint" style="flex: 1; min-width: 0; height: 100%; border: none; background: transparent; color: #F8FAFC; font-family: inherit; font-size: 16px; text-align: right">
        <button type="button" onClick="{{togglePw}}" aria-label="{{pwLabel}}" style="width: 44px; height: 44px; border: none; background: transparent; color: #94A3B8; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 2px" aria-hidden="true">
        <div style="height: 4px; border-radius: 2px; background: #10B981"></div>
        <div style="height: 4px; border-radius: 2px; background: #10B981"></div>
        <div style="height: 4px; border-radius: 2px; background: #10B981"></div>
        <div style="height: 4px; border-radius: 2px; background: #334155"></div>
      </div>
      <div id="su-pass-hint" style="font-size: 12px; color: #94A3B8">قوية · 8 أحرف على الأقل، وتحتوي على رقم وحرف كبير</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-pass2" style="font-size: 14px; font-weight: 600">تأكيد كلمة المرور</label>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 14px; background: #1E293B; border: 1.5px solid #334155">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <input id="su-pass2" type="password" autocomplete="new-password" dir="ltr" placeholder="••••••••" style="flex: 1; min-width: 0; height: 100%; border: none; background: transparent; color: #F8FAFC; font-family: inherit; font-size: 16px; text-align: right">
      </div>
    </div>
    <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: #94A3B8; line-height: 1.7; cursor: pointer"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #6366F1; margin: 3px 0 0; flex-shrink: 0"><span>أوافق على <a href="#">شروط الاستخدام</a> و<a href="#">سياسة الخصوصية</a></span></label>
    <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #4F46E5; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">إنشاء الحساب</a>
  </form>

  <div style="flex: 1"></div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 15px; color: #94A3B8">
    لديك حساب بالفعل؟
    <a href="Login.dc.html" style="font-weight: 700; text-decoration: none; padding: 10px 4px">تسجيل الدخول</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showPw: false };
  }
  renderVals() {
    const s = this.state.showPw;
    return {
      pwType: s ? 'text' : 'password',
      pwLabel: s ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور',
      togglePw: () => this.setState({ showPw: !s })
    };
  }
}
</script>
</body>
</html>
