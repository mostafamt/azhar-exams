<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>استعادة كلمة المرور</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A5B4FC}a:hover{color:#C7D2FE}
input::placeholder{color:#64748B}
input:focus{outline:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F172A; color: #F8FAFC; font-family: 'Cairo', sans-serif; direction: rtl; display: flex; flex-direction: column; padding: 20px 24px 28px; gap: 28px; overflow: hidden">
  <a href="Login.dc.html" aria-label="رجوع لتسجيل الدخول" style="width: 44px; height: 44px; border-radius: 12px; background: #1E293B; border: 1px solid #334155; color: #F8FAFC; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>

  <sc-if value="{{askEmail}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 24px">
      <div style="width: 72px; height: 72px; border-radius: 22px; background: rgba(99,102,241,0.18); color: #A5B4FC; display: flex; align-items: center; justify-content: center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="m10.8 12.2 8.2-8.2M17 6l2 2M15 8l2 2"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 800">نسيت كلمة المرور؟</h1>
        <div style="font-size: 15px; color: #94A3B8; line-height: 1.8">أدخل بريدك الإلكتروني المسجّل وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.</div>
      </div>
      <form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="fp-email" style="font-size: 14px; font-weight: 600">البريد الإلكتروني</label>
          <div style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 14px; border-radius: 14px; background: #1E293B; border: 1.5px solid #334155">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
            <input id="fp-email" type="email" autocomplete="email" dir="ltr" placeholder="name@example.com" style="flex: 1; min-width: 0; height: 100%; border: none; background: transparent; color: #F8FAFC; font-family: inherit; font-size: 16px; text-align: right">
          </div>
        </div>
        <button type="button" onClick="{{send}}" style="height: 56px; border-radius: 16px; border: none; background: #4F46E5; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">إرسال رابط إعادة التعيين</button>
      </form>
    </div>
  </sc-if>

  <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; padding-top: 40px">
      <div style="width: 96px; height: 96px; border-radius: 48px; background: rgba(16,185,129,0.16); color: #34D399; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px rgba(16,185,129,0.08)">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 800">تحقّق من بريدك</h1>
        <div style="font-size: 15px; color: #94A3B8; line-height: 1.8">أرسلنا رابط إعادة التعيين إلى<br><span dir="ltr" style="color: #F8FAFC; font-weight: 700">name@example.com</span></div>
      </div>
      <a href="Login.dc.html" style="width: 100%; height: 56px; border-radius: 16px; background: #4F46E5; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">العودة لتسجيل الدخول</a>
      <div style="font-size: 14px; color: #94A3B8; display: flex; align-items: center; gap: 4px">
        لم يصلك البريد؟
        <button type="button" onClick="{{reset}}" style="border: none; background: transparent; color: #A5B4FC; font-family: inherit; font-size: 14px; font-weight: 700; padding: 10px 4px; cursor: pointer">إعادة الإرسال</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sent":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: null };
  }
  renderVals() {
    const sent = this.state.sent ?? (this.props.sent ?? false);
    return {
      sent,
      askEmail: !sent,
      send: () => this.setState({ sent: true }),
      reset: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
